# The release packages: on a v* tag, built (`make package`, in the container
# of packaging/Containerfile) and published as that tag's GitHub release; run
# by hand, built and kept as the run's artifacts.
#
# Two jobs, because the build runs code from many crates' build scripts and
# the onnxruntime it downloads: its job may only read the repository, and the
# one job that may write runs nothing of the tree, only takes the files the
# build made and publishes them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # A clean build takes minutes; past this, something hangs.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says version $version"
            exit 1
          fi

      - name: Build the packages
        run: make package CONTAINER=docker

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tobii-linux-packages
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tobii-linux-packages
          path: dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "tobii-linux ${GITHUB_REF_NAME#v}"
