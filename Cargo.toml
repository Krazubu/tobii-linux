# Workspace root. The crates split along the production / research boundary:
# the daemon stack (tobii-proto -> tobii-pose -> tobii-usb -> tobiid), the
# client-facing pieces (tobii-ipc, tobii-ffi, tobii-clients) and the research
# CLI (tobii-tools). See INSTALL.md for the layout.
[workspace]
# Resolver 3 is not the default for a virtual manifest; without it the feature
# unification of ort/rusb would silently change.
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
# tobii_signing's four exports: SHA-256 with RSA PKCS#1 v1.5 over a PEM key,
# the signature in standard base64. Pure Rust, so libtobii.so keeps its
# system dependencies (the DLL links OpenSSL 1.1.1o for the same work).
base64 = "0.22"
libc = "0.2"
# Only the signing tests use it, to make their throwaway RSA key pair.
rand = "0.8"
# Pinned: ort's 2.0 release candidates change its API from one to the next
# (in rc.12 the session builder's setters fail with an error that carries the
# builder and is not Send, which tobii-pose converts), and a requirement of
# "2.0.0-rc.10" would take any later one, or 2.0.0, on a fresh resolve.
ort = "=2.0.0-rc.12"
rsa = { version = "0.9", features = ["sha2"] }
rusb = "0.9"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tobii-calib = { path = "crates/tobii-calib" }
tobii-ffi = { path = "crates/tobii-ffi" }
tobii-pose = { path = "crates/tobii-pose" }
tobii-proto = { path = "crates/tobii-proto" }
tobii-usb = { path = "crates/tobii-usb" }
tobii-ipc = { path = "crates/tobii-ipc" }
tobii-log = { path = "crates/tobii-log" }

# rust-skills: lint-deny-correctness, lint-warn-{suspicious,style,complexity,perf},
# lint-pedantic-selective, lint-cfg-check, lint-missing-docs, lint-unsafe-doc.
# Every member opts in with `[lints] workspace = true`; a member that forgets
# silently loses the whole table, so keep `make check` honest.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# pedantic, selectively (see rust-skills lint-pedantic-selective)
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
doc_markdown = "warn"
float_cmp = "warn"
manual_let_else = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
undocumented_unsafe_blocks = "warn"
# unwrap in non-test code: rust-skills err-no-unwrap-prod / anti-unwrap-abuse
unwrap_used = "warn"

# rust-skills opt-lto-release / opt-codegen-units / perf-release-profile.
# A profile in a member manifest is ignored, so this must stay at the root.
# panic stays "unwind": the daemon's watchdog recovers a panicked engine
# thread, and extern "C" fns already abort on unwind.
# The signing tests generate an RSA-2048 pair (crates/tobii-ffi/src/signing.rs);
# a committed key would be a private key in a public repository. Generating one
# is minutes of work with the bignum crate unoptimised and about a second with
# it optimised, so it is optimised even in debug builds. Nothing else in the
# workspace depends on it.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
