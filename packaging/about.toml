# cargo-about: the licences of the crates the packaged binaries link
# (packaging/build.sh writes THIRD-PARTY-LICENSES with about.hbs). Build and
# dev dependencies end up in no binary; the workspace's own crates are under
# LICENSE.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
